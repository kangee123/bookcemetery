services:
  - type: web
    name: bookcemetery
    env: python
    # Persistent disks (below) require a paid plan — not available on "free".
    # sync_data/ (each user's saved library, keyed by sync code) lives on this
    # disk; without it, every redeploy/restart wipes that data since the
    # container filesystem is otherwise ephemeral.
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    healthCheckPath: /
    disk:
      name: sync-data
      mountPath: /var/data/sync_data
      sizeGB: 1
    envVars:
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: SEOJI_CERT_KEY
        sync: false
      - key: SYNC_DATA_DIR
        value: /var/data/sync_data
