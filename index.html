<title>미완독묘</title>
<meta property="og:title" content="bookcemetery" />
<meta property="og:type" content="website" />

<link rel="icon" type="image/png" sizes="512x512" href="/site-assets/favicon.png" />
<link rel="apple-touch-icon" href="/site-assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<style>
  /*
    Source: Figma "Book" file (nOvyG9oaBd7mlT1CHNKBjW), node 22:3
    "0. 첫화면" — the empty-pile (0 books) stage of the same opening-screen
    set as opening-screen.html (which covers stage 3, node 28:311).
    Standalone screen, not wired into unread-cairn.html.
  */
  :root{
    --op-bg: #f4f2ee;
    --op-ink: #2b2a27;
    --op-ink-soft: #6f6b63;
    --op-ink-faint: #a8a29a;
    --op-ground: #8c8677;
    --op-nav-bg: #fbfaf7;
    --op-nav-border: #ddd8cf;
    --op-fab-bg: #2b2a27;
    --op-fab-fg: #f4f2ee;
    --op-stone-1: #e3e0d8;
    --op-stone-2: #c9c4b8;
    --op-stone-3: #aca697;
    --op-stone-edge: #8c8677;
    --op-canvas-bg: var(--op-bg);
    /* shared with unread-cairn.html's --accent token */
    --op-accent: #7c7364;
    --op-danger: #a15c4a;
  }

  *{ box-sizing: border-box; }
  /* overflow-x:hidden은 안전망 — 100vw는 스크롤바가 있는 환경(특히 일부 모바일
     인앱 브라우저)에서 실제 보이는 너비보다 커질 수 있어 본문에 가로 스크롤이
     생긴다. .screen은 아래에서 100%로 고쳤지만, 혹시 모를 미세한 폭 오차까지
     확실히 막기 위해 html/body 레벨에서 가로 스크롤 자체를 막아둔다 */
  html, body{ height: 100%; margin: 0; overflow-x: hidden; }
  body{
    background: #1c1b19;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    /* 모바일 사파리/크롬은 주소창이 접혔다 펼쳐지며 100vh가 실제 보이는 높이보다
       커져서 바디에 스크롤이 생긴다 (인앱 브라우저는 자체 UI가 고정이라 문제없음) —
       100dvh는 실제 보이는 높이를 따라가므로, 지원하는 브라우저에서 이 값으로 덮어쓴다 */
    min-height: 100dvh;
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Real device viewports already are whatever size they are — the fixed-size,
     rounded-corner "phone in your hand" card was only ever useful for viewing the
     Figma-matched mockup inside a desktop browser during design. The actual site
     just fills whatever it's given, at every breakpoint. */
  .screen{
    position: relative;
    width: 100%; /* 100vw였음 — 스크롤바가 있는 환경에서 실제 너비보다 커져
                    가로 스크롤을 유발할 수 있어 부모(body) 기준 100%로 변경 */
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    border-radius: 0;
    box-shadow: none;
    background: var(--op-canvas-bg);
    transition: background 0.6s ease;
    /* with viewport-fit=cover the page draws under the notch/home-indicator —
       the background (painted edge-to-edge) is fine there, but everything else
       is absolutely positioned relative to .screen's *padding* box, so insetting
       here pulls the nav, title, sheets etc. back in from those areas for free,
       with zero effect on devices that don't have any (env() just resolves 0) */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* ---------- responsive breakpoints ----------
     .screen is always full-bleed (100vw/100vh, no rounded corners, no shadow) at
     every breakpoint — no "device card" look anywhere, mobile included, since a
     real viewport is already whatever size it is.
     Mobile (<768px): matches the Figma design's 390px reference width (real phones
     are close enough that the hand-placed pixel positions still land correctly).
     Tablet (>=768px): fake status bar dropped, library switches to a 2-column grid.
     Desktop (>=1024px): bottom tab bar becomes a left side rail, library grid grows
     to 3 columns, and the pile scene scales up (see --pile-scale, set in JS) instead
     of sitting in a fixed 390px column — the ground plank is handled separately so
     it always spans the full width instead of just growing with the (centered)
     stone cluster; see "데스크톱 - 홈" in Figma. */
  .main-content{
    position: absolute;
    left: 0; top: 0; right: 0; bottom: 64px; /* 64px reserved for the bottom nav */
  }
  @media (min-width: 1024px){
    .main-content{ left: 96px; bottom: 0; } /* side nav takes the left 96px instead */
  }
  /* the pile scene keeps its original 390x780 Figma coordinate space always — at
     wider breakpoints it's simply scaled up (via JS-computed --pile-scale) and
     centered, so every hand-placed stone/ghost/plant position stays correct instead
     of needing to be rewritten per breakpoint. */
  /* anchored to the BOTTOM of main-content (not the top) so the ground always sits
     flush against the bottom nav — on a device whose aspect ratio isn't exactly
     iPhone 12's (390x844, this design's reference size), width- and height-based
     scale factors diverge and a top-anchored scene leaves a gap above the nav
     instead of extra space up near the header, where it's much less noticeable. */
  .pile-scene{
    position: absolute;
    left: 50%; bottom: 0; top: auto;
    width: 390px; height: 780px;
    transform-origin: bottom center;
    transform: translateX(-50%) scale(var(--pile-scale, 1));
  }
  /* iOS Safari zooms the whole page in when you tap a text field whose computed
     font-size is under 16px — force every text input/textarea up to exactly
     that threshold on phones, where it actually matters (desktop/tablet keep
     their designed sizes, since this can only happen on a touchscreen anyway).
     !important because this needs to win over every individual input's own
     font-size rule (search bars, form fields, settings inputs, etc.) rather
     than chasing each one's selector specificity. */
  @media (max-width: 767px){
    input, textarea, select{ font-size: 16px !important; }
  }
  /* Figma "2. 첫화면 (3단계)" — kicks in once the pile passes 5 books, per request */
  .screen.dark-mode{
    --op-canvas-bg: linear-gradient(to bottom, #30383f 8.827%, #6e6966 75.059%);
    --op-ground: #696563;
  }
  /* Figma "3. 첫화면 (4단계)" — from the 15th book on */
  .screen.dark-mode.stage4{
    --op-canvas-bg: linear-gradient(to bottom, #757a7f 0%, #1b232b 66.351%);
    --op-ground: #3a3f44;
  }
  .screen.dark-mode .op-title,
  .screen.dark-mode .pile-meta,
  .screen.dark-mode .status-bar{
    color: #f5f5f5;
  }

  /* ---------- status bar ----------
     the 9:41 clock/signal row was a Figma-mockup affordance for previewing inside a
     phone frame — a real device (or browser tab) already shows its own status bar,
     so this one is never shown; the markup is left in place only because JS toggles
     its text color for dark-mode transitions elsewhere. */
  .status-bar{ display: none; }
  .status-icons{ display: flex; align-items: center; gap: 6px; }
  .status-icons svg{ display: block; }

  /* ---------- header text ---------- */
  .op-title{
    position: absolute;
    left: 24px; top: 32px;
    margin: 0;
    font-family: 'Noto Serif KR', serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -0.26px;
    color: var(--op-ink);
    white-space: nowrap;
    transition: color 0.6s ease;
  }
  /* ---------- empty state ---------- */
  .empty-marker{
    position: absolute;
    left: 169px; top: 329px;
    width: 52px; height: 52px;
  }
  .empty-marker img{
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  .empty-marker span{
    position: absolute;
    top: 17.31%; bottom: 17.31%;
    left: 34.62%; right: 34.62%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 400;
    color: var(--op-ink-faint);
  }
  .empty-title{
    position: absolute;
    left: 93px; top: 407px;
    margin: 0;
    font-family: 'Noto Serif KR', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--op-ink);
    white-space: nowrap;
  }
  .empty-sub{
    position: absolute;
    left: 195px; top: 437px;
    width: 230px;
    margin: 0;
    transform: translateX(-50%);
    text-align: center;
    font-size: 13.5px;
    font-weight: 400;
    color: var(--op-ink-soft);
  }
  .screen.has-books .empty-marker,
  .screen.has-books .empty-title,
  .screen.has-books .empty-sub{ display: none; }

  /* ---------- pile meta (Figma "0. 첫화면") — replaces the old subtitle, always visible ---------- */
  .pile-meta{
    position: absolute;
    left: 24px; top: 80px; /* 10px below the title's rendered bottom edge (32px top + 37.5px line box) */
    margin: 0;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--op-ink-soft);
    white-space: nowrap;
    transition: color 0.6s ease;
  }
  .pile-meta b{ font-weight: 700; }

  /* ---------- cairn stones — real Matter.js bodies, not fixed slots ---------- */
  .stone{
    position: absolute;
    will-change: transform;
    z-index: 1;
    cursor: pointer;
  }
  .stone svg{
    display: block;
    overflow: visible;
    filter: drop-shadow(0 3px 3px rgba(30,28,22,0.16));
  }
  .stone-label{
    position: absolute;
    top: 50%; left: 50%;
    width: 78%;
    margin: 0;
    text-align: center;
    pointer-events: none;
    font-family: 'Noto Serif KR', serif;
    font-weight: 500;
    line-height: 1.15;
    color: var(--op-ink);
    word-break: keep-all;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .ghost{
    position: absolute;
    pointer-events: none;
    display: none;
    z-index: 3;
    filter: drop-shadow(0 6px 10px rgba(30,28,22,0.25));
    animation: ghostSway 3.2s ease-in-out infinite;
  }
  /* Figma "1. 첫화면 (2단계)" — asleep, tucked into the pile (1~5 books) */
  /* fixed beside the left plant — doesn't ride the falling stone */
  .ghost-sleep{ left: 71px; top: 704px; width: 70px; height: 52px; }
  /* rides the last-dropped stone down as it falls and settles (1.2x the base asset size) */
  .ghost-sit{ width: 79.2px; height: 64.44px; }
  /* Figma "3. 첫화면 (4단계)" — floats independently above the pile, not perched on a stone */
  .ghost-float{ left: 138px; top: 324px; width: 101.976px; height: 106.999px; }
  @keyframes ghostSway{
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-7px) rotate(3deg); }
  }

  /* "오늘 뭐 읽지?" trigger — parked in the header's dead space just under the meta line,
     a fixed spot that never collides with the pile no matter how tall it grows */
  .today-pick-btn{
    position: absolute;
    left: 195px; top: 180px;
    z-index: 4;
    transform: translateX(-50%);
    padding: 6px 12px;
    border-radius: 9999px;
    background: var(--op-nav-bg);
    border: 1px solid var(--op-nav-border);
    color: var(--op-ink-soft);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    font-size: 14px;
    white-space: nowrap;
    cursor: pointer;
    display: none;
  }

  /* ---------- ground ---------- */
  /* lives outside .pile-scene (a sibling, not scaled by --pile-scale) so it can
     always span the full main-content width instead of just growing along with the
     (centered, capped-width) stone cluster. Anchored to the bottom (matching
     .pile-scene's own bottom anchor) so it's always flush against the bottom nav
     regardless of scale — only height is set in JS, to track the scaled pile.
     Matches the "데스크톱 - 홈" Figma stage. */
  .ground{
    position: absolute;
    left: 0; right: 0; bottom: 0; height: 59px;
    background: var(--op-ground);
    transition: background 0.6s ease;
  }
  .plant{
    position: absolute;
    top: 688px;
    width: 67.4581px; height: 38.0754px;
    z-index: 2;
  }
  .plant-left{ left: 53px; }
  .plant-right{ left: 238px; }

  /* ---------- FAB ---------- */
  /* lives outside .pile-scene (same reason as .ground) so its desktop position can
     break away from "wherever the scaled pile cluster happens to be" — JS sets
     left/top (mobile & tablet, tracking the pile) or right/bottom (desktop, anchored
     to the real corner of the content area) in updatePileScale(). */
  .fab{
    position: absolute;
    left: 316px; top: 693px;
    width: 52px; height: 52px;
    border-radius: 50%;
    z-index: 4;
    background: var(--op-fab-bg);
    color: var(--op-fab-fg);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    font-size: 24px;
    box-shadow: 0 1px 2px rgba(30,28,22,0.06), 0 8px 24px rgba(30,28,22,0.06);
    cursor: pointer;
  }
  /* ---------- 오늘 뭐 읽지 — roulette glow on real stones ---------- */
  /* warm amber/lantern light — fits the paper-and-stone palette better than a saturated green */
  .stone.roulette-active svg,
  .stone.roulette-landed svg{
    filter: drop-shadow(0 0 3px #e3a537) drop-shadow(0 0 9px rgba(227,165,55,0.85));
  }
  .stone.roulette-active polygon,
  .stone.roulette-landed polygon{
    stroke: #e3a537 !important;
    stroke-width: 2px !important;
    stroke-opacity: 1 !important;
  }
  .stone.roulette-landed svg{
    animation: roulettePulse 0.9s ease-in-out infinite;
  }
  @keyframes roulettePulse{
    0%, 100% { filter: drop-shadow(0 0 3px #e3a537) drop-shadow(0 0 9px rgba(227,165,55,0.85)); }
    50%      { filter: drop-shadow(0 0 5px #e3a537) drop-shadow(0 0 16px rgba(227,165,55,1)); }
  }

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 64px;
    display: flex;
    background: var(--op-nav-bg);
    border-top: 1px solid var(--op-nav-border);
  }
  .nav-tab{
    flex: 1 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 10px 0;
    border: none;
    background: none;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
  }
  .nav-tab svg{ width: 24px; height: 24px; display: block; color: inherit; }
  .nav-tab span{ font-size: 11.5px; font-weight: 400; color: inherit; }
  .nav-tab.active{ color: #1c1b1f; }
  .nav-tab.active span{ font-weight: 500; }
  .nav-tab:not(.active){ color: #a8a29a; }
  /* desktop: the tab bar moves from the bottom edge to a left side rail */
  @media (min-width: 1024px){
    .bottom-nav{
      left: 0; top: 0; bottom: 0; right: auto;
      width: 96px; height: 100%;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      border-top: none;
      border-right: 1px solid var(--op-nav-border);
    }
    .nav-tab{ flex: none; width: 100%; padding: 16px 0; }
  }

  /* ---------- library view (Figma "6.") ---------- */
  .library-view{
    position: absolute;
    left: 0; top: 100px; right: 0; bottom: 64px;
    overflow-y: auto;
    display: none;
  }
  .screen.view-library .library-view{ display: block; }
  @media (min-width: 1024px){
    .library-view{ left: 96px; bottom: 0; }
  }

  .lib-search-row{
    display: flex;
    align-items: center;
    gap: 4px;
    height: 40px;
    margin: 0 24px 14px;
    padding: 11px 14px;
    border-radius: 10px;
    background: var(--op-bg);
    border: 1px solid var(--op-nav-border);
    transition: border-color 0.15s ease;
  }
  .lib-search-row:focus-within{ border-color: var(--op-accent); }
  .lib-search-row img{ width: 20px; height: 20px; flex-shrink: 0; }
  .lib-search-row input{
    flex: 1 0 0;
    min-width: 0;
    border: none;
    outline: none;
    background: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--op-ink);
  }
  .lib-search-row input::placeholder{ color: var(--op-ink-faint); }

  .lib-filter-row{
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 24px 16px;
  }
  .lib-filter-btn{
    flex-shrink: 0;
    height: 28px;
    padding: 0 10px;
    border: none;
    border-radius: 24px;
    background: var(--op-stone-1);
    color: var(--op-accent);
    font-family: 'Noto Serif KR', serif;
    font-weight: 500;
    font-size: 12.5px;
    line-height: 1.15;
    cursor: pointer;
  }
  .lib-filter-btn.active{
    background: var(--op-accent);
    color: var(--op-bg);
  }
  .lib-sort-btn{
    margin-left: auto;
    flex-shrink: 0;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--op-nav-border);
    border-radius: 24px;
    background: var(--op-nav-bg);
    color: var(--op-ink-soft);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    cursor: pointer;
  }
  #libEditBtn{ margin-left: 0; }
  .library-view.editing #libEditBtn{
    background: var(--op-ink);
    border-color: var(--op-ink);
    color: var(--op-bg);
  }

  .lib-selection-bar{
    display: none;
    align-items: center;
    justify-content: space-between;
    margin: 0 24px 14px;
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--op-nav-bg);
    border: 1px solid var(--op-nav-border);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12.5px;
    color: var(--op-ink-soft);
  }
  .library-view.editing .lib-selection-bar{ display: flex; }
  #libDeleteSelectedBtn{
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    background: var(--op-danger);
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
  }
  #libDeleteSelectedBtn:disabled{
    background: var(--op-nav-border);
    color: var(--op-ink-faint);
    cursor: default;
  }

  .lib-select-circle{
    display: none;
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--op-nav-border);
    background: var(--op-bg);
    align-items: center;
    justify-content: center;
  }
  .library-view.editing .lib-select-circle{ display: flex; }
  .lib-item.selected .lib-select-circle{
    background: var(--op-accent);
    border-color: var(--op-accent);
  }
  .lib-item.selected .lib-select-circle::after{
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fff;
  }

  .lib-empty{
    margin-top: 60px;
    text-align: center;
    font-size: 13.5px;
    color: var(--op-ink-faint);
  }
  .lib-list{ padding: 0 24px 24px; }
  @media (min-width: 768px){
    .lib-list{ display: grid; grid-template-columns: repeat(2, 1fr); column-gap: 20px; }
  }
  @media (min-width: 1024px){
    .lib-list{ grid-template-columns: repeat(3, 1fr); }
  }
  .lib-item{
    display: flex;
    align-items: center;
    gap: 12px;
    height: 60px;
    padding: 9px 4px;
    border-bottom: 1px solid var(--op-nav-border);
    cursor: pointer;
  }
  .lib-item:last-child{ border-bottom: none; }
  .lib-cover{
    flex-shrink: 0;
    width: 36px; height: 52px;
    border-radius: 3px;
    background: var(--op-stone-1);
    overflow: hidden;
  }
  .lib-cover img{
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .lib-info{
    flex: 1 0 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .lib-title{
    margin: 0;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--op-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lib-author{
    margin: 0;
    font-size: 12px;
    color: var(--op-ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lib-pct{
    flex-shrink: 0;
    margin: 0;
    font-size: 12px;

      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(30,28,22,0.25);

      transform: translate(-50%, -50%) scale(0.96);

<script>
  const overlay = document.getElementById('addBookOverlay');
  const searchInput = document.getElementById('bookSearchInput');
  const searchResults = document.getElementById('searchResults');

  // 카카오 다음 책 검색 API — 키는 절대 브라우저로 오지 않는다. server.py가
  // /api/search-books 로 들어온 요청을 받아 서버 쪽에서 Authorization: KakaoAK
  // 헤더를 붙여 카카오에 대신 요청하고, 결과 JSON만 그대로 돌려준다.
  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  function stripTags(s){
    return (s || '').replace(/<[^>]*>/g, '');
  }

  // --- 동기화 코드 (Figma 바텀 네비게이션 "설정" 탭, node 65:2314) ---
  // 코드/프로필은 이 브라우저에 로컬로 저장되고, server.py가 코드별로 sync_data/ 아래에
  // 서재 스냅샷을 저장해준다. 다른 기기·브라우저에서 같은 코드를 입력하면, 그 코드를
  // "이 기기의 코드"로 그대로 이어받아서 — 남의 서재를 구경하는 게 아니라 내 서재로 삼아서
  // 앞으로 계속 쓴다. (실시간 동기화는 아니고, 책이 바뀔 때마다 그 코드로 서버에 저장하는 방식)
  const SYNC_ADJECTIVES = ['조용한', '부지런한', '느긋한', '호기심많은', '다정한', '엉뚱한', '씩씩한', '차분한'];
  const SYNC_ANIMALS = ['올빼미', '고양이', '너구리', '두더지', '수달', '펭귄', '다람쥐', '여우'];

  function randomSyncCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 헷갈리는 0/O, 1/I는 뺐다
    let s = '';
    for (let i = 0; i < 8; i++) {
      if (i === 4) s += '-';
      s += chars[Math.floor(Math.random() * chars.length)];
    }
    return s;
  }
  function randomProfileName(){
    const a = SYNC_ADJECTIVES[Math.floor(Math.random() * SYNC_ADJECTIVES.length)];
    const b = SYNC_ANIMALS[Math.floor(Math.random() * SYNC_ANIMALS.length)];
    return `${a} ${b}`;
  }

  const IDENTITY_KEY = 'pd_identity_v1';
  let identity = JSON.parse(localStorage.getItem(IDENTITY_KEY) || 'null');
  if (!identity || !identity.code) {
    identity = { code: randomSyncCode(), name: randomProfileName() };
    localStorage.setItem(IDENTITY_KEY, JSON.stringify(identity));
  }

  let syncTimer = null;

  function serializeBooks(list){
    return list.map(b => ({
      ...b,
      addedAt: b.addedAt instanceof Date ? b.addedAt.toISOString() : b.addedAt,
      finishedAt: b.finishedAt instanceof Date ? b.finishedAt.toISOString() : b.finishedAt,
    }));
  }
  function reviveBooks(list){
    return (list || []).map(b => ({
      ...b,
      addedAt: b.addedAt ? new Date(b.addedAt) : new Date(),
      finishedAt: b.finishedAt ? new Date(b.finishedAt) : undefined,
    }));
  }

  function pushSync(){
    fetch('/api/sync/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code: identity.code,
        name: identity.name,
        customName: !!identity.customName,
        avatar: identity.avatar || '',
        books: serializeBooks(books),
        archive: serializeBooks(archive),
      }),
    }).catch(() => {}); // 동기화는 베스트 에포트 — 서버가 꺼져 있어도 로컬 사용엔 지장 없음
  }
  function scheduleSync(){
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushSync, 600);
  }

  // 코드를 입력해서 불러오면, 그 순간부터 이 기기는 그 코드를 자기 코드로 삼는다.
  // 지금 이 기기에 이미 쌓아둔 책이 있으면 그건 사라지므로 미리 확인을 받는다.
  async function adoptCode(code){
    const res = await fetch('/api/sync/load?code=' + encodeURIComponent(code), { cache: 'no-store' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '코드를 찾을 수 없어요.');

    // 무덤 위 돌을 전부 걷어내고 불러온 책으로 새로 쌓는다
    for (const id in bodiesById) {
      Matter.World.remove(world, bodiesById[id].body);
      bodiesById[id].el.remove();
      delete bodiesById[id];
    }
    lastStoneId = null;

    books.length = 0;
    books.push(...reviveBooks(data.books));
    archive.length = 0;
    archive.push(...reviveBooks(data.archive));

    identity = {
      code,
      name: typeof data.name === 'string' ? data.name : identity.name,
      customName: !!data.customName,
      avatar: data.avatar || '',
    };
    localStorage.setItem(IDENTITY_KEY, JSON.stringify(identity));

    books.forEach(b => dropStone(b.id, b));
    updatePileMeta();
    updateGhosts();
    showPickButton();
    renderLibrary();
    renderSettings();
  }

  // 처음 들어올 때(또는 새로고침할 때) 내 코드로 이미 저장된 서재가 있는지 서버에서
  // 먼저 확인해서 복원한다. 저장된 적 없는 새 코드면 지금(빈) 상태로 등록해서, 나중에
  // 이 코드를 다른 곳에서 입력해도 바로 조회는 되게 한다.
  // 예전엔 이 순서가 반대였다 — 페이지를 열자마자 로컬의 빈 books/archive를 곧장
  // 서버로 올려버려서, 책을 등록해도 새로고침하면 방금 그 "빈 상태 저장"이 이미
  // 서버 데이터를 덮어쓴 뒤라 복원할 게 없었다 (동기화가 "저장"은 잘 되는데 "불러오기"
  // 자체가 아예 없었던 셈).
  async function restoreOwnData(){
    try {
      const res = await fetch('/api/sync/load?code=' + encodeURIComponent(identity.code), { cache: 'no-store' });
      if (!res.ok) { scheduleSync(); return; } // 아직 서버에 없는 새 코드 — 지금 상태로 등록
      const data = await res.json();
      books.push(...reviveBooks(data.books));
      archive.push(...reviveBooks(data.archive));
      books.forEach(b => dropStone(b.id, b));
      updatePileMeta();
      updateGhosts();
      showPickButton();
      renderLibrary();
      renderSettings();
    } catch (e) {
      // 서버에 연결이 안 되면 로컬 빈 상태로 그냥 진행 — 확인도 안 된 채로 덮어쓰진 않는다
    }
  }

  const settingsCodeEl = document.getElementById('settingsCode');
  const settingsProfileNameEl = document.getElementById('settingsProfileName');
  const settingsProfileSubEl = document.getElementById('settingsProfileSub');
  const settingsProfileEditBtn = document.getElementById('settingsProfileEditBtn');
  const settingsAvatarEl = document.getElementById('settingsAvatar');
  const settingsCopyBtn = document.getElementById('settingsCopyBtn');
  const settingsCodeInput = document.getElementById('settingsCodeInput');
  const settingsLoadBtn = document.getElementById('settingsLoadBtn');
  const settingsErrorEl = document.getElementById('settingsError');

  const PROFILE_EDIT_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a1.5 1.5 0 0 0 0-2.1L17.1 6a1.5 1.5 0 0 0-2.1 0L4 16.5V20Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.5 8 16 10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  const PROFILE_CONFIRM_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5 10 17.5 19.5 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // 닉네임을 한 번이라도 직접 고쳐서 저장하면(edit 아이콘으로), 처음 만들어질 때 자동으로
  // 지어졌던 이름이라는 안내 대신 "프로필을 수정해보세요."로 바뀐다 — 편집 중엔 바뀌지 않고
  // 체크 아이콘을 눌러 실제로 저장하는 순간에만 반영된다.
  function profileSubText(){

    settingsProfileSubEl.textContent = profileSubText();

      settingsAvatarEl.innerHTML = `<img src="${identity.avatar}" alt="">`;

  settingsProfileNameEl.addEventListener('input', () => {
    // 편집 중엔 비어있을 때만 안내하고, 나머지는 체크를 눌러 커밋되는 순간에만 문구가 바뀐다 —
    // 지웠다가 다시 채우면 편집 시작 전 문구로 되돌아간다 (커밋 전까지는 안 바뀜)
    settingsProfileSubEl.textContent = settingsProfileNameEl.value.trim()

  // 연필 아이콘을 누르면 닉네임을 고칠 수 있고, 아이콘이 체크로 바뀐다 — 체크를 누르거나
  // 포커스를 벗어나거나 엔터를 치면 저장된다.
  settingsProfileEditBtn.addEventListener('click', () => {
    if (settingsProfileNameEl.readOnly) {
      profileSubBeforeEdit = settingsProfileSubEl.textContent;
      settingsProfileNameEl.readOnly = false;
      settingsProfileEditBtn.innerHTML = PROFILE_CONFIRM_ICON;
      settingsProfileNameEl.focus();
      settingsProfileNameEl.select();

      commitProfileName();

  function commitProfileName(){
    identity.name = settingsProfileNameEl.value.trim();
    identity.customName = true;
    localStorage.setItem(IDENTITY_KEY, JSON.stringify(identity));
    renderSettings();
    scheduleSync();
  }

  settingsProfileNameEl.addEventListener('blur', () => {
    if (!settingsProfileNameEl.readOnly) commitProfileName();
  });
  settingsProfileNameEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      settingsProfileNameEl.blur(); // blur 핸들러가 저장을 마무리한다
    } else if (e.key === 'Escape') {
      settingsProfileNameEl.readOnly = true; // 저장 없이 취소 — blur 핸들러가 건너뛴다
      settingsProfileNameEl.blur();
      renderSettings(); // 값·문구·아이콘을 저장 전 상태로 되돌린다
    }
  });

  // 프로필 사진 업로드 — 고른 이미지를 정사각형 중앙 기준으로 잘라 원형 아바타에 바로 보이도록 준비한다
  // (실제로 원 모양 alpha 마스크를 씌우는 게 아니라, 정사각형으로 크롭해서 넣으면 CSS의
  // border-radius:50%가 항상 정중앙 원형으로 보여준다 — 아바타가 어디서 쓰이든 동일하게 동작)
  const settingsAvatarEditBtn = document.getElementById('settingsAvatarEditBtn');
  const settingsAvatarInput = document.getElementById('settingsAvatarInput');
  const AVATAR_SIZE = 200;

  settingsAvatarEditBtn.addEventListener('click', () => settingsAvatarInput.click());
  settingsAvatarEl.addEventListener('click', () => settingsAvatarInput.click());

  settingsAvatarInput.addEventListener('change', () => {
    const file = settingsAvatarInput.files[0];
    settingsAvatarInput.value = ''; // 같은 파일을 다시 골라도 change가 또 뜨도록
    if (!file || !file.type.startsWith('image/')) return;

    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2;
        const sy = (img.height - side) / 2;
        const canvas = document.createElement('canvas');
        canvas.width = AVATAR_SIZE;
        canvas.height = AVATAR_SIZE;
        canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, AVATAR_SIZE, AVATAR_SIZE);
        identity.avatar = canvas.toDataURL('image/jpeg', 0.85);
        localStorage.setItem(IDENTITY_KEY, JSON.stringify(identity));
        renderSettings();
        scheduleSync();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('settingsLoadLabel').addEventListener('click', () => {

  settingsCopyBtn.addEventListener('click', () => {

  settingsLoadBtn.addEventListener('click', async () => {

  let lastSearchResults = [];

  function renderResults(documents){
    lastSearchResults = documents;
    if (!documents.length) {
      searchResults.innerHTML = '<p class="result-empty">검색 결과가 없어요.</p>';
      return;
    }
    searchResults.innerHTML = documents.map((d, i) => {
      const title = escapeHtml(stripTags(d.title));
      const authors = escapeHtml((d.authors || []).join(', ') || '저자 미상');
      const cover = d.thumbnail
        ? `<img class="result-cover" src="${escapeHtml(d.thumbnail)}" alt="">`
        : '<div class="result-cover"></div>';
      return `
        <div class="result-item" data-index="${i}">
          ${cover}
          <div class="result-meta">
            <p class="result-title">${title}</p>
            <p class="result-author">${authors}</p>
          </div>
        </div>`;
    }).join('');
    searchResults.querySelectorAll('.result-item').forEach(row => {
      row.addEventListener('click', () => {
        const d = lastSearchResults[Number(row.dataset.index)];
        if (!d) return;
        // 검색 결과를 고르면 직접입력 폼으로 넘어가서 표지/제목/저자가 채워진 채로 쪽수만 입력하면 됨
        const title = stripTags(d.title);
        document.getElementById('fTitle').value = title;
        document.getElementById('fAuthor').value = (d.authors || []).join(', ');
        document.getElementById('fTotal').value = '';
        showFormStep(d.thumbnail, true);
        // 카카오 검색 결과엔 전체쪽수가 없어서, 국립중앙도서관 서지정보로 별도 보충 조회한다.
        // 못 찾으면 fTotal은 빈 채로 남아 기존 직접 입력 폴백이 그대로 동작한다.
        fetchAndFillPages(d.isbn, title);
      });
    });
  }

  let pagesRequestSeq = 0;

  function fetchAndFillPages(isbn, title){
    const seq = ++pagesRequestSeq;
    const qs = new URLSearchParams();
    if (isbn) qs.set('isbn', isbn);
    if (title) qs.set('title', title);
    fetch(`/api/book-pages?${qs.toString()}`)
      .then(res => res.json())
      .then(data => {
        if (seq !== pagesRequestSeq) return; // 그 사이 다른 책을 고르면 무시
        const totalInput = document.getElementById('fTotal');
        if (data && data.pages && !totalInput.value) {
          totalInput.value = data.pages;
        }
      })
      .catch(() => {});
  }

  let searchRequestSeq = 0;
  let searchDebounceTimer = null;

  function runSearch(){
    const query = searchInput.value.trim();
    if (!query) {
      searchResults.classList.add('hidden');
      searchResults.innerHTML = '';
      return;
    }
    searchResults.classList.remove('hidden');
    searchResults.innerHTML = '<p class="result-empty">검색 중…</p>';

    const requestId = ++searchRequestSeq;
    fetch(`/api/search-books?query=${encodeURIComponent(query)}&size=10`)
      .then(res => res.json().then(data => ({ ok: res.ok, data })))
      .then(({ ok, data }) => {
        if (requestId !== searchRequestSeq) return; // 그 사이에 새 검색어가 들어왔으면 무시
        if (!ok) {
          searchResults.innerHTML = `<p class="result-empty">${escapeHtml(data.error || '검색에 실패했어요.')}</p>`;
          return;
        }
        renderResults(data.documents || []);
      })
      .catch(() => {
        if (requestId !== searchRequestSeq) return;
        searchResults.innerHTML = '<p class="result-empty">검색 서버에 연결할 수 없어요. server.py를 실행했는지 확인해주세요.</p>';
      });
  }

  // 검색 결과에서 고른 책인지(제목/저자 수정 불가) 직접 입력한 책인지(수정 가능) 기억해둔다

    // 눌러서 왔으면 등록 자체를 그만두는 "취소하기"로 버튼 문구/동작이 달라진다

  // 표지 사진 직접 올리기 — 정사각형으로 자를 필요 없이(책 표지는 원래 세로가 김),
  // 용량만 줄여서 데이터 URL로 들고 있다가 무덤에 올릴 때 book.thumbnail로 그대로 쓴다
  const FORM_COVER_MAX_DIMENSION = 480;

  function openFormCoverPicker(){
    if (currentFormFromApi) return; // 검색으로 가져온 표지는 잠겨 있다

  formCoverInput.addEventListener('change', () => {

    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(1, FORM_COVER_MAX_DIMENSION / Math.max(img.width, img.height));
        const w = Math.round(img.width * ratio), h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');

  // --- pile physics — ported from unread-cairn.html's Matter.js setup ---

  // 반응형: 무덤 씬은 항상 원래 피그마 좌표(390x780)로 그려지고, 화면이 넓어지면
  // (태블릿/데스크톱) 그 씬 전체를 --pile-scale 배로 키워서 넓은 공간을 채운다 —
  // 낱개 요소의 절대좌표를 화면 크기별로 다시 잡을 필요가 없다. 바닥(ground)만은
  // 씬 밖으로 뺀 별개 요소라 늘어난 스케일과 무관하게 항상 화면 폭 전체를 채우고,
  // 대신 위치·높이를 같은 배율로 맞춰서 쌓인 돌 더미의 아랫단과 이어지게 한다
  // (피그마 "데스크톱 - 홈" 스테이지에서 바닥만 넓혔던 것과 동일한 처리). FAB도 씬
  // 밖으로 뺀 별개 요소인데, 모바일/태블릿에서는 (전과 똑같이) 쌓인 돌 더미를 따라
  // 같이 커지지만, 데스크톱에서는 돌 더미 위치와 무관하게 화면 오른쪽 아래 구석에
  // 고정한다 — 가운데로 몰려 보인다는 피드백을 반영.
  function updatePileScale(){
    const scaleX = mainContentEl.clientWidth / 390;
    const scaleY = mainContentEl.clientHeight / 780;
    const scale = Math.min(scaleX, scaleY, 1.4);
    pileSceneEl.style.setProperty('--pile-scale', scale);
    groundEl.style.height = (59 * scale) + 'px'; // bottom:0 in CSS keeps it flush with the nav

    if (isDesktopQuery.matches) {
      fabEl.style.left = 'auto'; fabEl.style.top = 'auto';
      fabEl.style.right = '48px'; fabEl.style.bottom = '48px';
    } else {
      // fab's original spot was top:693 in the 390x780 reference (bottom edge at
      // 745, i.e. 35px above the reference's own bottom) — now that .pile-scene
      // anchors from the bottom, express it the same way: distance-from-bottom
      // scales with the pile, but the fab itself stays a fixed 52px circle.
      const fabX = 316;
      const pileLeftOffset = (mainContentEl.clientWidth - 390 * scale) / 2; // .pile-scene is centered
      fabEl.style.right = 'auto'; fabEl.style.top = 'auto';
      fabEl.style.left = (pileLeftOffset + fabX * scale) + 'px';
      fabEl.style.bottom = (87 * scale - 52) + 'px';
    }
  }

  const wallLeft = Matter.Bodies.rectangle(PILE_LEFT - 14, GROUND_Y - 450, 28, 900, { isStatic: true, friction: 0.4 });
  const wallRight = Matter.Bodies.rectangle(PILE_RIGHT + 14, GROUND_Y - 450, 28, 900, { isStatic: true, friction: 0.4 });
  Matter.World.add(world, [groundBody, wallLeft, wallRight]);

  const runner = Matter.Runner.create();
  Matter.Runner.run(runner, engine);

  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function polygonPoints(seed, size){
    const rand = mulberry32(seed);
    const n = 6 + Math.floor(rand() * 3); // 6~8각
    const pts = [];
    for (let i = 0; i < n; i++) {
      const angle = (i / n) * Math.PI * 2;
      const r = (size / 2) * (0.8 + rand() * 0.22);
      pts.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r * 0.94 });
    }
    return pts;
  }

  function stoneShade(seed){
    const rand = mulberry32(seed + 999);
    const shades = ['var(--op-stone-1)', 'var(--op-stone-2)', 'var(--op-stone-3)'];
    return shades[Math.floor(rand() * shades.length)];
  }

  let currentTopY = GROUND_Y;

  // --- 서재 (library list) — Figma "6." for the search bar / 전체·읽는 중·다 읽음 tabs;
  // the row language (cover + title + author) reuses what the app already had.
  const libEmpty = document.getElementById('libEmpty');
  const libList = document.getElementById('libList');
  const libSearchInput = document.getElementById('libSearchInput');
  const libSortBtn = document.getElementById('libSortBtn');
  const libFilterBtns = Array.from(document.querySelectorAll('.lib-filter-btn'));
  let libFilter = 'all';

  function finishedDateLabel(d){
    return `${d.getMonth() + 1}월 ${d.getDate()}일`;
  }

  function renderLibrary(){
    const query = libSearchInput.value.trim().toLowerCase();
    let rows = [
      ...books.map(b => ({ ...b, status: 'reading' })),
      ...archive.map(b => ({ ...b, status: 'done' })),
    ];
    if (libFilter === 'reading') rows = rows.filter(b => b.status === 'reading');
    if (libFilter === 'done') rows = rows.filter(b => b.status === 'done');
    if (query) {
      rows = rows.filter(b =>
        b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query));
    }
    rows.sort((a, b) => libSort === 'title'
      ? a.title.localeCompare(b.title, 'ko')
      : (b.finishedAt || b.addedAt) - (a.finishedAt || a.addedAt));

    libEmpty.style.display = rows.length ? 'none' : 'block';
    libEmpty.textContent = query || libFilter !== 'all'
      ? '조건에 맞는 책이 없어요.'
      : '서재가 비어있어요. 책을 추가해보세요.';

    libList.innerHTML = rows.map(b => {
      const pct = b.status === 'done' ? 100
        : (b.totalPages > 0 ? Math.round((b.pagesRead / b.totalPages) * 100) : 0);
      const sub = b.status === 'done'
        ? `${b.author} · ${finishedDateLabel(b.finishedAt)} 완독`
        : b.author;
      const selected = librarySelected.has(b.id);
      const cover = b.thumbnail
        ? `<div class="lib-cover"><img src="${escapeHtml(b.thumbnail)}" alt=""></div>`
        : '<div class="lib-cover"></div>';
      return `
        <div class="lib-item${selected ? ' selected' : ''}" data-id="${b.id}" data-status="${b.status}">
          <span class="lib-select-circle"></span>
          ${cover}
          <div class="lib-info">
            <p class="lib-title">${b.title}</p>
            <p class="lib-author">${sub}</p>
          </div>
          <p class="lib-pct">${pct}%</p>
        </div>`;
    }).join('');
    libList.querySelectorAll('.lib-item').forEach(row => {
      row.addEventListener('click', () => {
        if (libEditing) {
          const id = row.dataset.id;
          librarySelected.has(id) ? librarySelected.delete(id) : librarySelected.add(id);
          renderLibrary();
        } else {
          openDetail(row.dataset.id, row.dataset.status);
        }
      });
    });
    updateSelectionBar();
  }

  // --- 서재 편집 모드 — 왼쪽에 선택 동그라미가 뜨고, 고른 책을 한 번에 삭제 ---
  let libEditing = false;
  const librarySelected = new Set();
  const libEditBtn = document.getElementById('libEditBtn');
  const libSelectionBar = document.getElementById('libSelectionBar');
  const libSelectedCount = document.getElementById('libSelectedCount');
  const libDeleteSelectedBtn = document.getElementById('libDeleteSelectedBtn');

  function updateSelectionBar(){
    document.getElementById('libraryView').classList.toggle('editing', libEditing);
    libEditBtn.textContent = libEditing ? '완료' : '편집';
    libSelectedCount.textContent = `${librarySelected.size}개 선택됨`;
    libDeleteSelectedBtn.disabled = librarySelected.size === 0;
  }

  libEditBtn.addEventListener('click', () => {
    libEditing = !libEditing;
    if (!libEditing) librarySelected.clear();
    renderLibrary();
  });

  libDeleteSelectedBtn.addEventListener('click', () => {
    librarySelected.forEach(id => {
      if (books.some(b => b.id === id)) {
        removeStone(id);
      } else {
        const idx = archive.findIndex(b => b.id === id);
        if (idx !== -1) archive.splice(idx, 1);
      }
    });
    librarySelected.clear();
    libEditing = false;
    renderLibrary();
    scheduleSync();
  });

  libSearchInput.addEventListener('input', renderLibrary);
  libFilterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      libFilter = btn.dataset.filter;
      libFilterBtns.forEach(b => b.classList.toggle('active', b === btn));
      renderLibrary();
    });
  });
  libSortBtn.addEventListener('click', () => {
    libSort = libSort === 'recent' ? 'title' : 'recent';
    libSortBtn.textContent = libSort === 'recent' ? '최신순' : '제목순';
    renderLibrary();
  });

  // ghost/button visibility is driven by inline styles elsewhere (updateGhosts/showPickButton),
  // which always beat a CSS class on specificity — so switching tabs has to touch them directly too.
  // Background is also forced inline here since --op-canvas-bg loses to the dark-mode/stage4
  // variable override otherwise (higher selector specificity would win over a class swap alone).
  const pageTitle = document.getElementById('pageTitle');
  const statusBarEl = document.querySelector('.status-bar');
  document.getElementById('navHomeBtn').addEventListener('click', () => {
    screenEl.classList.remove('view-library', 'view-settings');
    screenEl.style.background = '';
    pageTitle.style.color = '';
    statusBarEl.style.color = '';
    pageTitle.textContent = '미완독묘';
    document.getElementById('navHomeBtn').classList.add('active');
    document.getElementById('navLibraryBtn').classList.remove('active');
    document.getElementById('navSettingsBtn').classList.remove('active');
    updateGhosts();
    showPickButton();
  });
  document.getElementById('navLibraryBtn').addEventListener('click', () => {
    screenEl.classList.add('view-library');
    screenEl.classList.remove('view-settings');
    screenEl.style.background = '#f4f2ee';
    pageTitle.style.color = '#2b2a27';
    statusBarEl.style.color = '#000000';
    pageTitle.textContent = '서재';
    document.getElementById('navLibraryBtn').classList.add('active');
    document.getElementById('navHomeBtn').classList.remove('active');
    document.getElementById('navSettingsBtn').classList.remove('active');
    ghostSleepImg.style.display = 'none';
    ghostImg.style.display = 'none';
    ghostFloatImg.style.display = 'none';
    pickBtn.style.display = 'none';
    renderLibrary();
  });
  document.getElementById('navSettingsBtn').addEventListener('click', () => {
    screenEl.classList.add('view-settings');
    screenEl.classList.remove('view-library');
    screenEl.style.background = '#f4f2ee';
    pageTitle.style.color = '#2b2a27';
    statusBarEl.style.color = '#000000';
    pageTitle.textContent = '설정';
    document.getElementById('navSettingsBtn').classList.add('active');
    document.getElementById('navHomeBtn').classList.remove('active');
    document.getElementById('navLibraryBtn').classList.remove('active');
    ghostSleepImg.style.display = 'none';
    ghostImg.style.display = 'none';
    ghostFloatImg.style.display = 'none';
    pickBtn.style.display = 'none';
    renderSettings();
  });

  // 1~5권: 자는 유령(풀 옆 고정) / 6~10권: 깨어난 유령(마지막 돌을 타고 내려옴) / 11권+: 떠있는 유령(고정).
  // "오늘 뭐 읽지?" 버튼은 위치가 CSS로 고정돼 있음 — 책을 추가할 때마다 사라졌다가 돌이 다 떨어진 뒤 다시 뜨기만 한다.
  function updateGhosts(){
    // adding a book while already browsing 서재 shouldn't pop a ghost in over there
    if (screenEl.classList.contains('view-library')) return;
    const isDark = books.length >= DARK_MODE_FROM;
    const isStage4 = books.length >= STAGE4_FROM;
    ghostSleepImg.style.display = (books.length > 0 && !isDark) ? 'block' : 'none';
    ghostImg.style.display = (isDark && !isStage4) ? 'block' : 'none';
    ghostFloatImg.style.display = isStage4 ? 'block' : 'none';
  }

  function showPickButton(){
    // a pending 900ms reveal (from addBook) can still fire after the user has
    // already switched to the library tab — don't let it pop back up over there
    if (screenEl.classList.contains('view-library')) return;
    pickBtn.style.display = books.length > 0 ? 'block' : 'none';
  }

  function dropStone(id, book){
    const title = book.title;
    const seedInt = Math.floor(Math.random() * 1e6);
    const rand = mulberry32(seedInt + 11);
    // "돌 크기는 랜덤이여도 돼요" — sized to match the actual stone range measured off
    // Figma "3. 첫화면 (4단계)" (~65-108px, avg ~82px), not shrunk down as the pile grows,
    // so 16 books actually pile up as tall as that reference instead of staying low and flat
    const size = 65 + rand() * 43;
    const pts = polygonPoints(seedInt + 7, size);
    const jitter = (rand() - 0.5) * (PILE_RIGHT - PILE_LEFT) * 0.5;
    const startX = PILE_CENTER_X + jitter;
    const startY = currentTopY - 480; // drop from well above the pile — "위에서 아래로"

    const body = Matter.Bodies.fromVertices(startX, startY, [pts], {
      friction: 0.65,
      frictionStatic: 1,
      restitution: 0.08,   // low bounce — natural settle, not a springy "튕김"
      density: 0.0025,
      angle: (rand() - 0.5) * 1.2,
    }, true);
    Matter.World.add(world, body);

    const shade = stoneShade(seedInt);
    const polyStr = pts.map(p => (p.x + size / 2) + ',' + (p.y + size / 2)).join(' ');
    const el = document.createElement('div');
    el.className = 'stone';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <polygon points="${polyStr}" fill="${shade}" stroke="var(--op-stone-edge)" stroke-width="0.75" stroke-opacity="0.4"/>
    </svg>`;

    const label = document.createElement('p');
    label.className = 'stone-label';
    label.style.fontSize = Math.max(8, Math.min(12.5, size * 0.15)) + 'px';
    label.textContent = title;
    el.appendChild(label);
    el.addEventListener('click', () => openDetail(id));

    pileSceneEl.appendChild(el); // fab now lives outside .pile-scene; z-index keeps it above stones regardless
    bodiesById[id] = { body, el, label, size };
    lastStoneId = id;
  }

  function renderLoop(){
    let minY = GROUND_Y;
    for (const id in bodiesById) {
      const entry = bodiesById[id];
      const body = entry.body;
      const half = entry.size / 2;
      entry.el.style.left = (body.position.x - half) + 'px';
      entry.el.style.top = (body.position.y - half) + 'px';
      entry.el.style.transform = `rotate(${body.angle}rad)`;
      entry.label.style.transform = `translate(-50%,-50%) rotate(${-body.angle}rad)`;
      if (body.position.y < minY) minY = body.position.y;
    }
    currentTopY = minY;

    // 깨어난 유령만 마지막으로 떨어진 돌을 타고 같이 내려온다 (자는/떠있는 유령은 CSS로 고정)
    const isDark = books.length >= DARK_MODE_FROM;
    const isStage4 = books.length >= STAGE4_FROM;
    if (isDark && !isStage4 && lastStoneId && bodiesById[lastStoneId]) {
      const top = bodiesById[lastStoneId];
      const gw = ghostImg.offsetWidth, gh = ghostImg.offsetHeight;
      ghostImg.style.left = (top.body.position.x - gw / 2) + 'px';
      ghostImg.style.top = (top.body.position.y - top.size / 2 - gh * 0.62) + 'px';
    }
    requestAnimationFrame(renderLoop);
  }
  requestAnimationFrame(renderLoop);
  updatePileMeta(); // "N권" meta line now replaces the old subtitle and shows even at 0 books

  function addBook({ title, author, totalPages, pagesRead, thumbnail, fromApi }){
    const id = 'b' + books.length + '_' + Date.now();
    const book = {
      id, title,
      author: author || '저자 미상',
      totalPages: totalPages || 0,
      pagesRead: Math.min(pagesRead || 0, totalPages || 0),
      addedAt: new Date(),
      thumbnail: thumbnail || '',
      fromApi: !!fromApi,
    };
    books.push(book);
    pickBtn.style.display = 'none'; // 책을 추가할 때마다 매번 사라졌다가
    dropStone(id, book);
    updatePileMeta();
    updateGhosts(); // 깨어난 유령은 즉시 나타나 떨어지는 돌을 타고 내려와야 하므로 지연 없음
    setTimeout(showPickButton, 900); // 돌이 다 떨어진 뒤에 다시 뜬다
    scheduleSync();
  }

  document.getElementById('submitFormBtn').addEventListener('click', () => {
    addBook({
      title: fTitleInput.value.trim() || '제목 없음',
      author: fAuthorInput.value.trim(),
      totalPages: parseInt(document.getElementById('fTotal').value, 10) || 0,
      pagesRead: parseInt(document.getElementById('fRead').value, 10) || 0,
      thumbnail: currentFormThumbnail,
      fromApi: currentFormFromApi,
    });
    overlay.classList.remove('open');
    resetAddBookSheet();
  });

  // --- book detail sheet (Figma "5. 책 상세보기") ---
  const detailOverlay = document.getElementById('detailOverlay');
  const detailTitle = document.getElementById('detailTitle');
  const detailAuthor = document.getElementById('detailAuthor');
  const detailDate = document.getElementById('detailDate');
  const detailPct = document.getElementById('detailPct');
  const detailPages = document.getElementById('detailPages');
  const detailFill = document.getElementById('detailFill');
  const detailTotalInput = document.getElementById('detailTotal');
  const detailReadInput = document.getElementById('detailRead');
  let detailBookId = null;
  let detailStatus = 'reading'; // 'reading' | 'done' — which array the book currently lives in

  function dateLabel(d){
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일에 올림`;
  }

  const detailCoverBox = document.querySelector('#detailOverlay .detail-cover');

  function renderDetail(book){
    const pct = book.finishedAt ? 100
      : (book.totalPages > 0 ? Math.round((book.pagesRead / book.totalPages) * 100) : 0);
    detailTitle.value = book.title;
    detailAuthor.value = book.author;
    detailTitle.readOnly = !!book.fromApi;
    detailAuthor.readOnly = !!book.fromApi;
    detailCoverBox.innerHTML = book.thumbnail
      ? `<img src="${escapeHtml(book.thumbnail)}" alt="">`
      : '';
    detailDate.textContent = dateLabel(book.addedAt);
    detailPct.textContent = pct + '%';
    detailPages.textContent = `${book.pagesRead} / ${book.totalPages}쪽`;
    detailFill.style.width = pct + '%';
    detailTotalInput.value = book.totalPages || '';
    detailReadInput.value = book.pagesRead || '';
  }

  function openDetail(id, status){
    const source = status === 'done' ? archive : books;
    const book = source.find(b => b.id === id);
    if (!book) return;
    detailBookId = id;
    detailStatus = book.finishedAt ? 'done' : 'reading';
    renderDetail(book);
    // an already-finished book has nothing left to "mark as read"
    document.getElementById('detailMarkReadBtn').style.display = detailStatus === 'done' ? 'none' : '';
    detailOverlay.classList.add('open');
  }

  function closeDetail(){
    detailOverlay.classList.remove('open');
    detailBookId = null;
  }

  document.getElementById('detailClose').addEventListener('click', closeDetail);

  document.getElementById('detailSaveBtn').addEventListener('click', () => {
    const source = detailStatus === 'done' ? archive : books;
    const book = source.find(b => b.id === detailBookId);
    if (!book) return;
    if (!book.fromApi) {
      book.title = detailTitle.value.trim() || book.title;
      book.author = detailAuthor.value.trim() || book.author;
    }
    book.totalPages = parseInt(detailTotalInput.value, 10) || 0;
    book.pagesRead = Math.min(parseInt(detailReadInput.value, 10) || 0, book.totalPages);
    // the physical stone still on the pile shows its own copy of the title — keep it in sync
    const stoneEntry = bodiesById[book.id];
    if (stoneEntry) stoneEntry.label.textContent = book.title;
    renderDetail(book);
    renderLibrary();
    scheduleSync();
  });

  function removeStone(id){
    const entry = bodiesById[id];
    if (!entry) return;
    Matter.World.remove(world, entry.body);
    entry.el.remove();
    delete bodiesById[id];
    const idx = books.findIndex(b => b.id === id);
    if (idx !== -1) books.splice(idx, 1);
    if (lastStoneId === id) lastStoneId = books.length ? books[books.length - 1].id : null;
    // sleeping stones don't notice their support vanished — wake everything
    // still standing so the pile actually resettles instead of floating in place
    for (const otherId in bodiesById) {
      Matter.Sleeping.set(bodiesById[otherId].body, false);
    }
    updatePileMeta();
    updateGhosts();
    showPickButton();
    scheduleSync();
  }

  // "다 읽었어요" — takes the book off the pile but keeps its record under 서재 > 다 읽음
  function archiveBook(id){
    const book = books.find(b => b.id === id);
    if (!book) return;
    archive.push({ ...book, pagesRead: book.totalPages, finishedAt: new Date() });
    removeStone(id);
  }

  document.getElementById('detailMarkReadBtn').addEventListener('click', () => {
    if (detailBookId) archiveBook(detailBookId);
    closeDetail();
  });

  // --- "오늘 뭐 읽지" — green glow chases across the real stones, then lands ---
  let rouletteRunning = false;

  function setStoneGlow(el, on){
    el.classList.toggle('roulette-active', on);
  }

  document.getElementById('rouletteBtn').addEventListener('click', () => {
    if (rouletteRunning || books.length === 0) return;
    const order = books.map(b => ({ id: b.id, el: bodiesById[b.id] && bodiesById[b.id].el })).filter(o => o.el);
    if (order.length === 0) return;

    rouletteRunning = true;
    const targetIdx = Math.floor(Math.random() * order.length);
    const loops = 2 + Math.floor(Math.random() * 2); // 2~3바퀴 돌고 멈춤
    const totalSteps = loops * order.length + targetIdx + 1;
    let step = 0;
    let prevEl = null;

    function tick(){
      if (prevEl) setStoneGlow(prevEl, false);
      const idx = step % order.length;
      const current = order[idx];
      setStoneGlow(current.el, true);
      prevEl = current.el;
      step++;

      if (step >= totalSteps) {
        current.el.classList.remove('roulette-active');
        current.el.classList.add('roulette-landed');
        setTimeout(() => {
          current.el.classList.remove('roulette-landed');
          rouletteRunning = false;
          openDetail(order[targetIdx].id);
        }, 900);
        return;
      }
      // 점점 느려지며 하나에 멈추는 느낌 (roulette easing)
      const progress = step / totalSteps;
      const delay = 60 + (360 - 60) * Math.pow(progress, 2.2);
      setTimeout(tick, delay);
    }
    tick();
  });
</script>

</body>
</html>
