<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>미완독묘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /*
    Source: Figma "Book" file (nOvyG9oaBd7mlT1CHNKBjW), node 28:311
    "2. 첫화면 (3단계)" — one of four opening-screen stage variants
    (0/1/2/3 -> stage 1-4) that scale the pile + mood by book count.
    This file reproduces the currently-selected stage-3 variant only,
    as a standalone screen (not wired into unread-cairn.html).
  */
  :root{
    --op-grad-top: #30383f;
    --op-grad-bottom: #6e6966;
    --op-text-oncanvas: #f5f5f5;
    --op-ink: #2b2a27;
    --op-ink-faint: #a8a29a;
    --op-ground: #696563;
    --op-nav-bg: #fbfaf7;
    --op-nav-border: #ddd8cf;
    --op-fab-bg: #2b2a27;
    --op-fab-fg: #f4f2ee;
  }

  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }
  body{
    background: #1c1b19;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .screen{
    position: relative;
    width: 390px;
    height: 844px;
    overflow: hidden;
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    background: linear-gradient(to bottom, var(--op-grad-top) 8.827%, var(--op-grad-bottom) 75.059%);
  }

  /* ---------- status bar ---------- */
  .status-bar{
    position: absolute;
    left: 0; top: 0; width: 100%; height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    color: var(--op-text-oncanvas);
    font-size: 15px;
    font-weight: 600;
    z-index: 5;
  }
  .status-icons{ display: flex; align-items: center; gap: 6px; }
  .status-icons svg{ display: block; }

  /* ---------- header text ---------- */
  .op-title{
    position: absolute;
    left: 24px; top: 84px;
    margin: 0;
    font-family: 'Noto Serif KR', serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -0.26px;
    color: var(--op-text-oncanvas);
    white-space: nowrap;
  }
  .op-sub{
    position: absolute;
    left: 24px; top: 132px;
    margin: 0;
    font-size: 13px;
    font-weight: 400;
    color: var(--op-text-oncanvas);
    white-space: nowrap;
  }
  .op-meta{
    position: absolute;
    left: 24px; top: 159px;
    margin: 0;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--op-text-oncanvas);
    white-space: nowrap;
  }

  /* ---------- ground ---------- */
  .ground{
    position: absolute;
    left: 0; top: 721px;
    width: 390px; height: 59px;
    background: var(--op-ground);
  }

  /* ---------- cairn stones ---------- */
  .stone-slot{
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stone-rot{ position: relative; flex-shrink: 0; }
  .stone-img{
    position: absolute;
    top: 0; left: 1.25%; right: 1.25%; bottom: 4.95%;
    width: auto; height: auto;
    display: block;
  }
  .stone-label{
    position: absolute;
    transform: translateX(-50%);
    margin: 0;
    font-family: 'Noto Serif KR', serif;
    font-weight: 500;
    line-height: 1.15;
    color: var(--op-ink);
    text-align: center;
    word-break: keep-all;
  }

  /* ---------- mascot + plants ---------- */
  .mascot{
    position: absolute;
    left: 153px; top: 469px;
    width: 94.3242px; height: 76.7142px;
  }
  .plant{
    position: absolute;
    top: 684px;
    width: 62px; height: 39px;
  }
  .plant-left{ left: 63px; }
  .plant-right{ left: 238px; }

  /* ---------- FAB ---------- */
  .fab{
    position: absolute;
    left: 316px; top: 693px;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--op-fab-bg);
    color: var(--op-fab-fg);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    font-size: 24px;
    box-shadow: 0 1px 2px rgba(30,28,22,0.06), 0 8px 24px rgba(30,28,22,0.06);
    cursor: pointer;
  }

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    position: absolute;
    left: 0; top: 780px;
    width: 390px; height: 64px;
    display: flex;
    background: var(--op-nav-bg);
    border-top: 1px solid var(--op-nav-border);
  }
  .nav-tab{
    flex: 1 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 10px 0;
  }
  .nav-tab img{ width: 24px; height: 24px; }
  .nav-tab span{ font-size: 11.5px; }
  .nav-tab.active span{ font-weight: 500; color: var(--op-ink); }
  .nav-tab:not(.active) span{ color: var(--op-ink-faint); }
  .nav-tab:nth-child(3) span{ font-weight: 400; }
</style>
</head>
